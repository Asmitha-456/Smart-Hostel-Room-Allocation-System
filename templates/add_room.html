{% extends "base.html" %}
{% block content %}
<div class="form-box">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 style="margin: 0;">Add Hostel Room</h1>
        <a href="{{ url_for('rooms') }}" style="color: #64748b; text-decoration: none; font-size: 14px;">&larr; Back to Rooms</a>
    </div>

    <form method="post" action="{{ url_for('add_room') }}">
        <label for="room_no">Room Number *</label>
        <input type="text" id="room_no" name="room_no" placeholder="e.g. B101, B102, G201" required autofocus>
        <small style="color: #64748b; font-size: 12px; display: block; margin-top: -3px; margin-bottom: 12px;">Tip: Use prefixes like B for Boys and G for Girls rooms for clarity.</small>

        <label for="gender">Hostel Block Category *</label>
        <select id="gender" name="gender" required>
            <option value="">-- Select Block --</option>
            <option value="Boys">Boys Hostel Block</option>
            <option value="Girls">Girls Hostel Block</option>
        </select>

        <label for="room_type">Room Sharing Type *</label>
        <select id="room_type" name="room_type" onchange="syncCapacity(this.value)" required>
            <option value="Double Sharing">Double Sharing (2 Beds)</option>
            <option value="Single Room">Single Room (1 Bed)</option>
            <option value="Triple Sharing">Triple Sharing (3 Beds)</option>
            <option value="4-Sharing">4-Sharing (4 Beds)</option>
        </select>

        <label for="capacity">Total Bed Capacity *</label>
        <input type="number" id="capacity" name="capacity" min="1" max="10" value="2" required>
        <small style="color: #64748b; font-size: 12px; display: block; margin-top: -3px; margin-bottom: 12px;">Maximum number of students that can occupy this room.</small>

        <div style="margin-top: 25px; display: flex; gap: 10px;">
            <button class="button" type="submit">💾 Save Room</button>
            <a href="{{ url_for('rooms') }}" class="button button-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
function syncCapacity(val) {
    const capInput = document.getElementById('capacity');
    if (val === 'Single Room') capInput.value = 1;
    else if (val === 'Double Sharing') capInput.value = 2;
    else if (val === 'Triple Sharing') capInput.value = 3;
    else if (val === '4-Sharing') capInput.value = 4;
}
</script>
{% endblock %}
